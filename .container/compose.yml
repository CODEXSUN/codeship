# Contract only. CodeShip renders the operational Compose file from its private registry.
name: devkits
services:
  codeship:
    image: ${RELEASE_IMAGE:?CodeShip must supply the approved image digest}
    ports:
      - "127.0.0.1:14350:4350"
    pull_policy: always
    init: true
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
# Private environment, networks and persistent volumes are operator-owned.
# Port contract: CodeShip must validate the actual listener before deployment.
