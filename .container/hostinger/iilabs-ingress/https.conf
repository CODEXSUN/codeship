# Managed by CodeShip: iilabs.in ingress
server {
    listen 80;
    listen [::]:80;
    server_name iilabs.in;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }
    location / { return 308 https://iilabs.in$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name iilabs.in;
    ssl_certificate /etc/letsencrypt/live/iilabs.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iilabs.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:14435;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_connect_timeout 5s;
        proxy_intercept_errors on;
        error_page 502 504 =503 @unavailable;
    }
    location @unavailable {
        default_type text/plain;
        return 503 "Service unavailable\n";
    }
}
